<title>Elifoot 98</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
/* Recriacao das telas do Elifoot 98 (Windows 3.1, 800x600) para celular na vertical.
   Paleta e controles do Win 3.1: titulo azul-marinho, cinza 3D, fundo verde; o clube usa as suas duas cores. */
:root {
  --navy: #000080; --cinza: #c0c0c0; --cinza-esc: #808080; --verde: #008000; --amarelo: #ffff00; --verde-claro: #80ff80;
  --f: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Verdana, Arial, sans-serif;
  --c1: #ff0000; --c2: #0000ff;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--verde); color: #000; font: bold 12px/1.25 var(--f); -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
#app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

/* janelas Win 3.1 */
.tit { background: var(--navy); color: #fff; text-align: center; font-weight: bold; padding: 2px 4px; position: relative; min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tit.cinza { background: var(--cinza); color: #000; border-bottom: 1px solid #000; }
.tit .sis { position: absolute; left: 2px; top: 2px; width: 14px; height: 13px; background: var(--cinza); border: 1px solid #000; }
.tit .sis::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 2px; background: #fff; box-shadow: 0 1px 0 #000; }
.janela { background: var(--cinza); border: 2px solid var(--navy); box-shadow: 0 0 0 1px #000, 3px 3px 0 rgba(0,0,0,.35); }
.janela .corpo { padding: 8px; }
.cx { border: 2px solid; border-color: var(--cinza-esc) #fff #fff var(--cinza-esc); background: #fff; }
.grupo { border: 1px solid var(--cinza-esc); box-shadow: 1px 1px 0 #fff; padding: 8px 6px 6px; position: relative; margin-top: 8px; }
.grupo > .leg { position: absolute; top: -8px; left: 6px; background: inherit; padding: 0 3px; font-weight: normal; }
.bt { color: #000; background: var(--cinza); border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: inset -1px -1px 0 var(--cinza-esc); padding: 4px 10px; min-height: 30px; cursor: pointer; }
.bt:active { border-color: #000 #fff #fff #000; box-shadow: inset 1px 1px 0 var(--cinza-esc); }
.bt[disabled] { color: var(--cinza-esc); text-shadow: 1px 1px 0 #fff; }
.bt.grande { color: #000; display: inline-grid; justify-items: center; gap: 1px; min-width: 72px; min-height: 54px; font-weight: normal; padding: 4px 8px; }
.bt.grande > span:not(.ic) { -webkit-text-fill-color: #000; color: #000; }
.bt.grande .ic { -webkit-text-fill-color: currentColor; }
.ok .ic { color: #008000 !important; } .no .ic { color: #c00000 !important; }
.bt[disabled] > span { -webkit-text-fill-color: var(--cinza-esc); color: var(--cinza-esc); }
.din-ext { font-weight: bold; min-height: 32px; margin-top: 4px; font-size: 13px; }
.bt.grande .ic { font-size: 20px; line-height: 1; font-weight: bold; }
.ok .ic { color: #008000; } .no .ic { color: #c00000; }
.linhabt { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
input[type=text], input[type=number], select { color: #000; -webkit-text-fill-color: #000; caret-color: #000; background: #fff; border: 2px solid; border-color: var(--cinza-esc) #fff #fff var(--cinza-esc); padding: 3px 4px; min-height: 26px; font-weight: bold; }
input[type=checkbox], input[type=radio] { width: 16px; height: 16px; margin: 0 6px 0 0; vertical-align: -3px; accent-color: #000; }
.lista { background: #fff; border: 2px solid; border-color: var(--cinza-esc) #fff #fff var(--cinza-esc); overflow-y: auto; font-weight: normal; }
.lista .ln { display: grid; padding: 1px 4px; white-space: nowrap; }
.lista .ln > * { overflow: hidden; text-overflow: ellipsis; }
.lista .ln.sel { background: var(--navy); color: #fff; }
.lista.escolha { color: #000; font-weight: bold; }
.lista.escolha .ln { grid-template-columns: 14px minmax(0,1fr) 20px; gap: 3px; padding: 5px 4px; border-bottom: 1px solid #ddd; cursor: pointer; }
.lista.escolha .ln:active { background: #ccd; }
.n { text-align: right; font-variant-numeric: tabular-nums; }

/* camada de dialogos */
#dlg:empty { display: none; }

#dlg > .janela { width: 100%; max-width: 480px; max-height: calc(100vh - 20px); display: flex; flex-direction: column; }
#dlg > .janela > .corpo { overflow-y: auto; }

/* menu */
.menu { background: #fff; display: flex; flex-wrap: nowrap; overflow-x: auto; border-bottom: 1px solid #000; scrollbar-width: none; }
.menu::-webkit-scrollbar { display: none; }

#cortina { position: fixed; inset: 0; z-index: 40; }

.drop button { display: flex; justify-content: space-between; gap: 18px; width: 100%; background: none; border: 0; padding: 6px 12px; text-align: left; cursor: pointer; }

/* ecra principal do clube */
.clube { background: var(--c1); color: var(--c2); flex: 1; display: flex; flex-direction: column; padding: 6px 6px 8px; gap: 6px; }
.cab { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.cab .trn { font: bold 17px/1.1 "Times New Roman", Times, serif; }
.cab .ano { font: bold 15px/1 "Times New Roman", serif; }
.band { display: flex; align-items: center; gap: 8px; font-weight: normal; }
.band img, .flag { width: 32px; height: 24px; image-rendering: pixelated; border: 1px solid #808080; background: #fff; display: inline-grid; place-items: center; font-size: 9px; color: #000; }
.adv { background: var(--a1, #fff); color: var(--a2, #000); padding: 2px 6px; font-weight: normal; border: 1px solid #000; }
.adv b { font-weight: normal; font-size: 13px; }
.painel { min-height: 214px; display: flex; flex-direction: column; gap: 6px; font-weight: normal; }
.mini { display: grid; grid-template-columns: 1fr repeat(3, 18px) 22px 8px 22px 22px; font-size: 11px; border: 1px solid #000; }
.mini > div { padding: 1px 3px; }
.mini .r1 { background: var(--c1); color: var(--c2); }
.barra { height: 18px; border: 2px solid; border-color: var(--cinza-esc) #fff #fff var(--cinza-esc); background: var(--cinza); padding: 2px; }
.barra > i { display: block; height: 100%; background: var(--amarelo); }
.abas { display: flex; gap: 0; border-top: 1px solid var(--c2); overflow-x: auto; scrollbar-width: none; }
.abas button { flex: 1; background: none; border: 1px solid var(--c2); border-top: 0; color: var(--c2); padding: 4px 2px; font-weight: normal; text-decoration: underline; white-space: nowrap; transform: skewX(-12deg); margin-right: -1px; }
.abas button > span { display: inline-block; transform: skewX(12deg); }
.abas button[aria-pressed=true] { background: var(--c2); color: var(--c1); }
.plantel { background: var(--c2b, var(--c2)); color: var(--c1t, var(--c1)); border: 2px solid; border-color: var(--cinza-esc) #fff #fff var(--cinza-esc); flex: 1; min-height: 240px; padding: 2px 0; }
.jg { display: grid; grid-template-columns: 12px 14px minmax(0,1fr) 22px 24px 34px 44px 10px; gap: 0 4px; padding: 2px 4px; align-items: center; white-space: nowrap; cursor: pointer; }
.jg > span { overflow: hidden; text-overflow: ellipsis; }
.jg.sel { outline: 1px dotted var(--c1t, var(--c1)); outline-offset: -2px; background: color-mix(in srgb, var(--c2b, var(--c2)) 65%, var(--c1t, var(--c1))); }
.sep { border-top: 1px solid var(--c1t, var(--c1)); margin: 2px 0; }
.ptit { font-size: 16px; font-weight: bold; text-align: center; margin: 6px 0; }
.lin { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.hist { border: 1px solid var(--c2); padding: 8px 6px 4px; position: relative; margin-top: 6px; display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; }
.hist .leg { position: absolute; top: -8px; left: 6px; background: var(--c1); padding: 0 3px; }

/* ecra da jornada */
.jornada { background: var(--verde); flex: 1; display: flex; flex-direction: column; color: var(--amarelo); }
.jornada .tit { background: var(--cinza); color: #000; border-bottom: 1px solid #000; }
.relogio { display: flex; justify-content: flex-end; padding: 4px 6px 0; }
.quadro { border: 1px solid #000; box-shadow: 1px 1px 0 #3c3; margin: 0 6px 6px; padding: 2px 4px 6px; }
.dv { color: var(--amarelo); font-weight: bold; margin: 4px 0 1px 40px; }
.jogo { display: grid; grid-template-columns: 40px minmax(0,1fr) 12px 12px minmax(0,1fr); gap: 0 3px; align-items: center; font-size: 11.5px; }
.jogo .pub { text-align: right; font-weight: normal; font-size: 10.5px; }
.jogo .eq { padding: 0 3px; border: 1px solid #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: normal; line-height: 15px; }
.jogo .g { text-align: center; font-weight: bold; }
.jogo .ev { grid-column: 2 / -1; font-weight: normal; font-size: 10.5px; min-height: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 2px; }
.ico-v { display: inline-block; width: 8px; height: 10px; background: #f00; vertical-align: -1px; margin-right: 3px; }
.ico-l { display: inline-block; width: 10px; height: 10px; background: #fff; color: #f00; font-size: 10px; line-height: 10px; text-align: center; vertical-align: -1px; margin-right: 3px; }
.pag { display: flex; justify-content: flex-end; gap: 2px; margin: 0 6px 6px; }
.pag .bt { min-height: 24px; padding: 0 8px; }

/* dialogos especificos */
.leilao .corpo { background: var(--amarelo); }
.leilao .baixo { background: var(--c1); color: var(--c2); padding: 6px; margin: 8px -8px -8px; display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; font-weight: normal; }
.verdec .corpo { background: var(--verde-claro); }
.desemp { font: italic bold 22px/1.2 "Times New Roman", serif; letter-spacing: .25em; text-align: center; }
.placarg { font-size: 34px; color: #0000c0; text-align: center; font-weight: bold; }
.penalti { font: bold 40px/1.2 "Times New Roman", serif; color: #0000c0; letter-spacing: .3em; text-align: center; padding: 30px 0; background: #fff; }
.cores-dlg .corpo { background: var(--c1); color: var(--c2); }
.cl { display: grid; grid-template-columns: 18px minmax(0,1fr) 20px 20px 20px 20px 24px 24px 28px; gap: 0 3px; align-items: center; font-size: 13px; min-height: 26px; border-bottom: 1px solid rgba(255,255,255,.18); }
.cl .eq { padding: 3px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: normal; border: 1px solid #000; }
.cl.cab { font-size: 11px; min-height: 18px; color: #fff; position: sticky; top: 0; background: var(--verde); z-index: 1; }
.cl.meu .eq { outline: 2px solid var(--amarelo); outline-offset: 1px; }
.cl.desce > span:first-child { color: #ff8080; } .cl.sobe > span:first-child { color: #80ff80; }
.cl-tit { margin: 12px 0 2px !important; font-size: 14px; }
.tab-class { display: grid; grid-template-columns: minmax(0,1fr) 16px 16px 16px 22px 6px 22px 24px; gap: 0 2px; font-size: 11px; align-items: center; }
.tab-class .eq { padding: 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: normal; }
.verde-int { background: var(--verde); color: var(--amarelo); padding: 6px; }
.separadores { display: flex; gap: 2px; margin-bottom: -2px; position: relative; z-index: 1; }
.separadores button { background: var(--cinza); border: 2px solid; border-color: #fff #000 transparent #fff; padding: 3px 10px; font-weight: normal; }
.separadores button[aria-pressed=true] { padding-bottom: 5px; text-decoration: underline; color: var(--navy); }
.pg { border: 2px solid; border-color: #fff #000 #000 #fff; padding: 10px 8px; font-weight: normal; display: grid; gap: 8px; }
.inicio { flex: 1; display: grid; place-items: center; padding: 12px; }
.inicio .janela { width: 100%; max-width: 420px; }
.logo { font: italic bold 40px/1 "Times New Roman", serif; text-align: center; color: var(--navy); margin: 6px 0 2px; }
.lnr { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
#toast { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: #ffffe1; color: #000; border: 1px solid #000; padding: 6px 10px; z-index: 60; font-weight: normal; max-width: 92vw; }
</style>

<script>const NOMES_PAISES_TXE = {};</script>
<script>/* Motor do jogo — implementacao propria das regras documentadas em especificacao/03 a 18.
   Sem dados do original embutidos: os times vem de uma liga ficticia gerada ou de arquivos .EFT importados. */
"use strict";
const Motor = (() => {

// ------------------------------------------------------------------ aleatorio (estado salvavel)
function criarRng(seed) {
  let s = seed >>> 0;
  const r = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.n = (n) => n <= 0 ? 0 : Math.floor(r() * n);       // Random(n) do Pascal
  r.estado = () => s; r.definir = (v) => { s = v >>> 0; };
  return r;
}
let R = criarRng(1);

// ------------------------------------------------------------------ constantes (docs 05, 08, 15, 17)
const MOEDAS = {                                                                               // doc 15
  escudos: { nome: "Escudos (contos)", sufixo: " contos", q: 100000, s: 1, premio1: 3000000, premio2: 1000000, premio3: 500000, u: 0.5 },
  euros:   { nome: "Euros", sufixo: " euros", q: 500000, s: 4, premio1: 15000000, premio2: 5000000, premio3: 3000000, u: 2 },
  dolares: { nome: "Dólares", sufixo: " dólares", q: 500000, s: 5, premio1: 20000000, premio2: 6000000, premio3: 3000000, u: 2 },
  reais:   { nome: "Reais", sufixo: " reais", q: 500000, s: 5, premio1: 20000000, premio2: 6000000, premio3: 3000000, u: 2 } };
let MOEDA = MOEDAS.escudos;
const usarMoeda = (k) => { MOEDA = MOEDAS[k] || MOEDAS.escudos; return MOEDA; };
// menu "Seleccionar" do original (F1..F12), mais "Automatico" (A) e "Melhores" (M) - validado no jogo original
const FORMACOES = { "3-3-4": [1, 3, 3, 4], "3-4-3": [1, 3, 4, 3], "4-2-4": [1, 4, 2, 4], "4-3-3": [1, 4, 3, 3], "4-4-2": [1, 4, 4, 2], "4-5-1": [1, 4, 5, 1],
  "5-2-3": [1, 5, 2, 3], "5-3-2": [1, 5, 3, 2], "5-4-1": [1, 5, 4, 1], "5-5-0": [1, 5, 5, 0], "6-3-1": [1, 6, 3, 1], "6-4-0": [1, 6, 4, 0] };
const ESQUEMAS_ESPECIAIS = { auto: "Automático", melhores: "Melhores" };
const COTA = [[3,8,7,3,0,22],[3,8,7,4,0,22],[3,8,8,5,0,23],[4,8,8,5,0,24],[4,9,8,5,0,25],[4,9,8,5,0,26]];
const POS = ["GOL", "DEF", "MEI", "ATA"];
const NOME_POS = ["Goleiros", "Defensores", "Meio-campistas", "Atacantes"];
const GRUPOS = [
  ["POR","ESP","FRA","ITA","ALE","AUT","GRE","ING","ESC","WAL","ILN","IRL","DIN","BEL","HOL","LUX","FIN","SUE"],
  ["POR","BRA","ANG","MOC","CAV","STP","GBI","GNE","TIM"]];
const TEMPERAMENTO = ["Fair play", "Cordeirinho", "Cavalheiro", "Caneleiro", "Caceteiro", "Sarrafeiro"];

// ------------------------------------------------------------------ regras basicas
const nivelPorPosicao = (i) => i <= 32 ? Math.max(Math.round(50 * (1 - i / 32)) - 1, 5) : 1;   // doc 05
const forcaJogador = (L) => Math.min(Math.max(L + 3 - R.n(7), 1), 50);
const baseDivisao = (d) => 52 - 14 * d;                                                        // doc 12
const roundP = (x) => { const f = Math.floor(x), d = x - f; if (d > 0.5) return f + 1; if (d < 0.5) return f; return f % 2 === 0 ? f : f + 1; };

function atributosDoNome(nome, pos) {                                                          // doc 04/10
  let soma = 0; for (const ch of nome) soma += Math.min(ch.charCodeAt(0), 255);
  let t = roundP(5 - Math.trunc(Math.sqrt(soma % 36)));
  if (pos === 1) t = (t + 2) % 6;
  const h = soma % 10 + 1, g = soma % 11;
  return { t, h, g, estrela: (h >= 8 && pos >= 2) ? 1 : 0 };
}

function categoria(nac, pais) {                                                                // doc 15/17
  if (nac === pais) return 0;
  if (GRUPOS.some(gr => gr.includes(nac) && gr.includes(pais))) return 1;
  return 2;
}

// ------------------------------------------------------------------ financas (docs 08, 09, 11)
const salario = (F, X, m) => { const s = MOEDA.s;
  const v = 35 * Math.sqrt(Math.max(X, 0)) * s * m * Math.pow(F, 1.04) * Math.pow(1000, 0.04);
  return Math.min(Math.max(roundP(v / (50 * s)) * 50 * s, 50 * s), 50000 * s); };
const salarioPedido = (base, rodada) => roundP(base * (rodada * 0.2 / 14 + 1) * 1.1 / 50 / MOEDA.s) * 50 * MOEDA.s;
const precoJogador = (j, m) => { const A = Math.pow(j.f, 1.04) * MOEDA.s * m;
  return roundP(2000 * A * (1 - 0.2 * (j.t / 5) - 0.2 * (j.g / 10) + 0.2 * (j.h / 10))); };
const juros = (d) => roundP(0.05 * d);
const capacidade = (t) => t.estadio * 5000;
const mediaForca = (t) => t.jog.length ? roundP(t.jog.reduce((a, j) => a + j.f, 0) / t.jog.length) : 1;
const folha = (t) => t.jog.reduce((a, j) => a + j.sal, 0);
function limiteEmprestimo(t, m) { const q = MOEDA.q;
  let v = roundP(mediaForca(t) * t.fator * m * MOEDA.s * 20000); v = Math.floor(v / q) * q; return v || q; }
function precoBilhete(F, X, m, copa) {
  X = Math.max(X, 0.1);
  let p = roundP(MOEDA.s * m / Math.sqrt(X) * F / 5 * (1 + 0.5 * (copa ? 1 : 0))) / 2;
  p = Math.max(p, 0.5 * MOEDA.s);
  return MOEDA.u > 1 ? roundP(p / MOEDA.u) * MOEDA.u : p;
}
function publico(A, B, copa, neutro) {
  const base = (3 * mediaForca(A) + mediaForca(B) + 3 * R()) * Math.sqrt(A.fator) * Math.sqrt(B.fator) * 200;
  return Math.min(roundP(Math.pow(base, 1.04) * (1 + 0.3 * (copa ? 1 : 0))), neutro ? Math.max(capacidade(A), capacidade(B), 50000) : capacidade(A));
}
function atualizaIndice(m, temporada) {
  const r1 = R(), r2 = R(), r3 = R();
  m += (temporada % 100 < 50) ? 0.01 * (r1 + r2 - r3) : 0.01 * (r1 - r2 - r3);
  return Math.max(Math.min(m, 10), 0.5);
}
function lancar(t, valor, conta) { t.caixa += valor; t.contas[conta] = (t.contas[conta] || 0) + valor; }

// ------------------------------------------------------------------ criacao de jogo (doc 05)
function novoJogador(id, nome, pos, nac, f) {
  return Object.assign({ id, nome, pos, nac, f, papel: 0, c: 0, susp: 0, les: 0, sal: 50, gols: 0, golsTemp: 0, reneg: false, jogos: 0 },
                       atributosDoNome(nome, pos));
}

function cotasDosPaises(equipas, paises, rng) {
  // 1028:1604 conta os times de cada pais; 1028:1b95 corta ao acaso ate 128 times, tirando mais dos paises grandes
  const cota = {}; for (const e of equipas) if (paises.includes(e.p)) cota[e.p] = (cota[e.p] || 0) + 1;
  let total = Object.values(cota).reduce((a, b) => a + b, 0);
  const lista = Object.keys(cota);
  while (total > 128) { const p = lista[rng.n(lista.length)]; if (cota[p] > 0 && rng.n(128) < cota[p]) { cota[p]--; total--; } }
  return cota;
}

function criarJogo(equipas, paises, idHumano, nomeTreinador, seed, opcoes) {
  opcoes = opcoes || {};
  if (!Array.isArray(paises)) paises = [paises];
  usarMoeda(opcoes.moeda || "escudos");
  R = criarRng(seed || (Date.now() & 0x7fffffff));
  // 1020:367a: forca de 20 a 1; dentro da mesma forca, na ordem dos arquivos; respeitando a cota de cada pais
  const cota = cotasDosPaises(equipas, paises, R);
  const lista = [];
  for (let f = 20; f >= 0; f--) equipas.forEach((e, k) => {
    if ((f === 0 ? e.f <= 0 : e.f === f) && cota[e.p] > 0) { cota[e.p]--; lista.push({ e, k }); }
  });
  if (idHumano != null && !lista.some(o => o.k === idHumano)) {      // garante o clube escolhido
    const e = equipas[idHumano]; if (e) { lista.pop(); lista.push({ e, k: idHumano }); lista.sort((a, b) => b.e.f - a.e.f || a.k - b.k); }
  }
  const pais = paises.slice().sort((a, b) => equipas.filter(e => e.p === b).length - equipas.filter(e => e.p === a).length)[0];
  let pid = 1;

    if (ra === "gol") pa++; if (rb === "gol") pb++; cob.push([0, ba[k % ba.length].nome, ra], [1, bb[k % bb.length].nome, rb]);
    if (k > 40) { pa += 1; break; }
  }
  jogo.pen = pa > pb ? "casa" : "fora"; jogo.penTxt = `${pa}-${pb} nos pênaltis`;
  return pa > pb ? A : B;
}

function posJogo(st, t, rodada) {
  for (const j of t.jog) { if (j.susp) j.susp--; if (j.les) j.les--; }
  lancar(t, -folha(t), "salarios");
  lancar(t, -juros(t.divida), "juros");
  renegociar(st, t, rodada);
}

function renegociar(st, t, rodada) {                                                           // doc 18
  if (rodada <= 1) return;
  const cand = t.jog.filter(j => !j.reneg).map(j => ({ j, novo: salario(j.f, t.X, st.m) })).map(o => (o.r = o.novo / Math.max(o.j.sal, 1), o));
  if (!cand.length) return;
  if (ehHumano(st, t)) {
    const p = cand.filter(o => o.r > 1.3 && o.novo - o.j.sal > 300).sort((a, b) => b.r - a.r)[0];
    const vg = vagaDe(st, t);
    if (p && !vg.pedidos.some(q => q.id === p.j.id)) { p.j.reneg = true; vg.pedidos.push({ id: p.j.id, pedido: salarioPedido(p.novo, rodada), atual: p.j.sal }); }
    const baixo = cand.filter(o => o.r < 1.0).sort((a, b) => a.r - b.r)[0];
    if (baixo) { baixo.j.sal = baixo.novo; baixo.j.reneg = true; }
    return;
  }
  const lo = cand.filter(o => o.r < 1.2).sort((a, b) => a.r - b.r)[0];
  const hi = cand.filter(o => o.r > 0.8).sort((a, b) => b.r - a.r)[0];
  for (const o of [lo, hi]) if (o && !o.j.reneg) { o.j.sal = o.novo; o.j.reneg = true; }
}

// ------------------------------------------------------------------ mercado (doc 17)
const media = mediaForca;
const faixa = (t) => Math.min(Math.floor(media(t) / 10), 5);
const contaPos = (t, p) => t.jog.filter(j => j.pos === p).length;
const estrangeiros = (t) => t.jog.filter(j => categoria(j.nac, t.pais) === 2).length;
function utilidade(t, j) {
  const fx = faixa(t);
  let u = Math.pow(5 / (j.t + 1), 0.25) * COTA[fx][j.pos] / (contaPos(t, j.pos) + 1) * COTA[fx][5] / (t.jog.length + 1) * j.f / (media(t) + 1);
  const c = categoria(j.nac, t.pais); return u * (c === 0 ? 1.5 : c === 1 ? 1.2 : 1);
}
// 1010:5a6a (validado no original): elenco com mais de 11; nao suspenso nem lesionado; nao renovado/contratado nesta
// temporada (+0x16); goleiro so se houver outro; jogador de linha so se sobrarem mais de 10 de linha
function motivoNaoSai(t, j) {
  if (t.jog.length <= 11) return "o elenco ficaria com menos de 11 jogadores";
  if (j.susp) return "ele está suspenso";
  if (j.reneg) return "ele já foi contratado ou renovou nesta temporada";
  if (j.les) return "ele está lesionado";
  if (j.pos === 0 && contaPos(t, 0) <= 1) return "é o único goleiro";
  if (j.pos !== 0 && t.jog.length - contaPos(t, 0) <= 10) return "sobrariam menos de 10 jogadores de linha";
  return "";
}
const podeSair = (t, j) => !motivoNaoSai(t, j);
function interesse(B, j) {
  const av = media(B), fx = faixa(B);
  let i = (j.f / (av + 5)) * (COTA[fx][j.pos] + 1) / (contaPos(B, j.pos) + 1) * COTA[fx][5] / (B.jog.length + 1);
  i = Math.pow(i, 0.25) * Math.pow(Math.max(av, 1), 0.1);
  if (j.pos === 0 && contaPos(B, 0) === 1) i *= 1.5;
  const c = categoria(j.nac, B.pais), e = estrangeiros(B);
  let k = c === 0 ? 1.5 + 0.05 * e : c === 1 ? 1.15 + 0.05 * e : 1;
  if (j.estrela) k *= 1.1;
  return i * k;
}
function elegivel(B, j) {
  if (B.jog.length >= 24) return false;
  if (estrangeiros(B) >= 5 && categoria(j.nac, B.pais) === 2) return false;
  return true;
}
function oferta(st, B, j) {
  if (COTA[faixa(B)][j.pos] === contaPos(B, j.pos)) return 0;
  const sal = salario(j.f, B.X, st.m);
  let V = precoJogador(j, st.m) * interesse(B, j);
  const P = folha(B), Rz = (B.caixa - V) / (P + 1 + sal);
  if (Rz < 3) V = B.caixa - 3 * (P + sal); else if (Rz > 5) V = V * Math.log(Rz) / 1.6;
  if (P > 100 && B.caixa - V > 10 * P && B.caixa - V > 1) V = V * (Math.log((B.caixa - V) / P - 9) / 10 + 1);
  const of = Math.max(0, Math.min(roundP(B.caixa - V - 5 * P), roundP(V)));
  return Math.floor(of / 1000) * 1000;
}

function transferir(st, vendedor, j, comprador, valor) {
  vendedor.jog = vendedor.jog.filter(q => q !== j); comprador.jog.push(j);
  j.sal = salario(j.f, comprador.X, st.m); j.papel = 0; j.reneg = true;
  lancar(vendedor, valor, "vendas"); lancar(comprador, -valor, "compras");
  for (const t of [vendedor, comprador]) if (t.escalacao) { t.escalacao.tit = t.escalacao.tit.filter(id => id !== j.id); t.escalacao.banco = t.escalacao.banco.filter(id => id !== j.id); }
  st.historico.unshift({ temp: st.temporada, rod: st.rodada, nome: j.nome, de: vendedor.curto, para: comprador.curto, valor });
  st.historico = st.historico.slice(0, 60);
  st.nTransf = (st.nTransf || 0) + 1;
  if (ehHumano(st, vendedor)) noticia(st, `${j.nome} vendido para o ${comprador.curto} por ${dinheiro(valor)}.`);
  if (ehHumano(st, comprador)) noticia(st, `${j.nome} contratado do ${vendedor.curto} por ${dinheiro(valor)}.`);
}

function leilao(st, vendedor, j, minimo, lanceHumano, idLicitante) {
  let melhor = null, comprador = null;
  for (const B of st.times) {
    if (B === vendedor || ehHumano(st, B) || !elegivel(B, j) || B.caixa < minimo) continue;
    const of = oferta(st, B, j);
    if (of >= minimo && (melhor === null || of > melhor)) { melhor = of; comprador = B; }
  }
  const H = timePorId(st, idLicitante != null ? idLicitante : st.humano);
  if (lanceHumano && H !== vendedor && lanceHumano >= minimo && (melhor === null || lanceHumano > melhor) && elegivel(H, j) && H.caixa >= lanceHumano) {
    melhor = lanceHumano; comprador = H;
  }
  if (!comprador) return null;
  transferir(st, vendedor, j, comprador, melhor);
  return { comprador, valor: melhor };
}

function decidirVenda(st, t, rodada) {
  if (ehHumano(st, t)) {
    if (t.caixa < 0) {
      const cand = t.jog.filter(j => podeSair(t, j)); if (!cand.length) return;
      const j = cand.reduce((a, b) => utilidade(t, a) <= utilidade(t, b) ? a : b);
      const r = leilao(st, t, j, 0); if (r) noticia(st, `Caixa negativo: ${j.nome} foi vendido à força para o ${r.comprador.curto}.`);
    }
    return;
  }
  const cand = t.jog.filter(j => podeSair(t, j)); if (!cand.length) return;
  if (t.caixa < 0) { leilao(st, t, cand.reduce((a, b) => utilidade(t, a) <= utilidade(t, b) ? a : b), 0); return; }
  if (rodada <= 1) return;
  const cheio = estrangeiros(t) === 5, aperto = t.caixa * 3 < folha(t);       // 1010:3aad
  if (aperto || R.n(20) === 0 || (cheio && t.jog.length >= 21)) {
    // com a cota de 5 estrangeiros cheia, so um estrangeiro pode ser posto a venda (validado: todas as vendas vistas eram de estrangeiros)
    const lista = cheio ? cand.filter(q => categoria(q.nac, t.pais) === 2) : cand; if (!lista.length) return;
    const j = lista.reduce((a, b) => utilidade(t, a) <= utilidade(t, b) ? a : b);
    const minimo = Math.floor(roundP(precoJogador(j, st.m) * 1.6 * (st.pf || 1)) / 1000) * 1000;      // 1010:3aad: preco * 1.6 * DS:2b50
    if (!st.aVenda.some(a => a.id === j.id)) st.aVenda.push({ id: j.id, time: t.id, minimo, rod: rodada, temp: st.temporada });
  }
}

// leiloes do computador, um a um (dialogo "Venda de jogador por leilao" do original)
function leiloesPendentes(st) {
  return st.aVenda.map(a => { const t = timePorId(st, a.time), j = t && t.jog.find(q => q.id === a.id); return j ? { a, t, j } : null; }).filter(Boolean);
}
function interesseHumano(st, j) { return interesse(timePorId(st, st.humano), j); }
function resolverLeilao(st, idJog, lance) {
  R.definir(st.rng);
  const k = st.aVenda.findIndex(a => a.id === idJog); if (k < 0) return null;
  const a = st.aVenda.splice(k, 1)[0], t = timePorId(st, a.time), j = t && t.jog.find(q => q.id === a.id);
  if (!j) return null;
  const H = timePorId(st, st.humano);
  let r = null;
  if (lance && lance > H.caixa) lance = 0;
  r = leilao(st, t, j, a.minimo, lance || 0, st.humano);
  st.rng = R.estado();
  return r ? { comprador: r.comprador, valor: r.valor, jogador: j, vendedor: t } : { comprador: null, jogador: j, vendedor: t };
}
function resolverMercado(st) {
  const lista = st.aVenda; st.aVenda = [];
  for (const a of lista) {
    const t = timePorId(st, a.time); const j = t && t.jog.find(q => q.id === a.id);
    if (!j) continue;
    guardarVez(st);
    const vagas = st.humanos || [{ id: st.humano, lances: st.lances, treinador: st.treinador }];
    let lance = 0, quem = null;
    for (const h of vagas) { const v = (h.lances || {})[a.id] || 0; if (v > lance && h.id !== t.id) { lance = v; quem = h; } }
    const r = leilao(st, t, j, a.minimo, lance, quem ? quem.id : null);
    for (const h of vagas) if ((h.lances || {})[a.id] && (!r || r.comprador.id !== h.id)) noticia(st, `Lance de ${h.treinador} por ${j.nome} foi superado${r ? " pelo " + r.comprador.curto : ""}.`);
  }
  st.lances = {}; if (st.humanos) st.humanos.forEach(h => h.lances = {}); guardarVez(st);
}

function gerirFinancas(st, t) {                                                                // doc 09 (computador)
  if (ehHumano(st, t)) return;
  const lim = limiteEmprestimo(t, st.m);
  while (t.divida > 0 && t.caixa - folha(t) - juros(t.divida) > 0) {
    const pago = Math.min(t.divida, t.caixa - folha(t) - juros(t.divida)); t.divida -= pago; t.caixa -= pago;
  }
  while (t.caixa < folha(t) + juros(t.divida) && t.divida < lim) {
    const v = Math.min(lim - t.divida, Math.max(folha(t), MOEDA.q)); t.divida += v; t.caixa += v;
  }
}

// ------------------------------------------------------------------ rodada
function noticia(st, txt) { st.noticias.unshift({ temp: st.temporada, rod: st.rodada, txt }); st.noticias = st.noticias.slice(0, 80); }
function dinheiro(v) { return Math.round(v).toLocaleString("pt-BR") + MOEDA.sufixo; }

function anotarCal(t, r, adv, casa, gp, gc, pub, copa) { (t.cal || (t.cal = [])).push({ r, adv: adv.id, casa, gp, gc, pub, copa: copa || null }); }
function registrar(t, gp, gc) {
  t.gp += gp; t.gc += gc;
  if (gp > gc) { t.v++; t.pts += 3; } else if (gp === gc) { t.e++; t.pts++; } else t.d++;
}

function aposJogo(st, t, gp, gc, emCasa, rodada) {
  // moral (1010:9396 + 1068:10d1): media movel com peso 0.85; vitoria 2, derrota 0, empate 0.8 em casa / 1.3 fora
  const alvo = gp > gc ? 2 : gp < gc ? 0 : (emCasa ? 0.8 : 1.3);
  t.fator = 0.85 * t.fator + 0.15 * alvo;
  t.tj = (t.tj || 0) + 1;
  verificarTreinador(st, t);
  posJogo(st, t, rodada);
  decidirVenda(st, t, rodada);
  if (!ehHumano(st, t) && podeAmpliar(t) && t.caixa > 2 * folha(t) + custoObra(t, st.m)) ampliar(st, t);
}

const copaDevida = (st, rodada) => rodada % 2 === 0 && st.copa.vivos.length > 1 && st.times.length > Math.pow(2, Math.floor((14 - rodada) / 2));
// proxima etapa: "liga" (jornada) ou "copa" (rodada propria da Taca, depois das jornadas pares - visto no original)
const proximaEtapa = (st) => st.copaPendente ? "copa" : "liga";
function iniciarRodada(st) {
  R.definir(st.rng);
  resolverMercado(st);
  if (st.copaPendente) {
    const rod = { rodada: st.rodada, temporada: st.temporada, fase: "copa", ativos: [], res: { rodada: st.rodada, temporada: st.temporada, divisoes: [], copa: null }, fim: false };
    st.arbAtual = embaralhar(st.arbitros.slice()); st.arbIdx = 0;
    iniciarCopa(st, rod);
    if (!rod.ativos.length) { st.copaPendente = false; fecharEtapaCopa(st, rod); }
    return rod;
  }
  st.rodada += 1; const rodada = st.rodada;
  st.arbAtual = embaralhar(st.arbitros.slice()); st.arbIdx = 0;
  const rod = { rodada, temporada: st.temporada, fase: "liga", ativos: [], res: { rodada, temporada: st.temporada, divisoes: [], copa: null }, fim: false };
  for (let d = 0; d < st.nDiv; d++) {
    const div = st.ordem[d].map(id => timePorId(st, id));
    const F = roundP(div.reduce((a, t) => a + mediaForca(t), 0) / div.length), X = div.reduce((a, t) => a + t.X, 0) / div.length;
    const preco = precoBilhete(F, X, st.m, false);
    for (const [c, f] of TABELA[rodada - 1]) { const pm = iniciarPartida(st, div[c], div[f], 0, proximoArbitro(st)); pm.d = d; pm.preco = preco; pm.publico = publico(div[c], div[f], false); rod.ativos.push(pm); }
  }
  if (!rod.ativos.length) fecharRodada(st, rod);
  return rod;
}
function fecharEtapaCopa(st, rod) {
  st.ultimaRodada = resumo(st, rod.res);
  if (rod.rodada === 14) fimTemporada(st);
  st.rng = R.estado();
  rod.fim = true; rod.ativos = [];
}

function proximoArbitro(st) { const l = st.arbAtual || st.arbitros; const r = l[(st.arbIdx || 0) % l.length]; st.arbIdx = (st.arbIdx || 0) + 1; return r; }

function minutoRodada(st, rod) {
  if (rod.fim) return;
  for (const pm of rod.ativos) minutoPartida(pm);
  if (rod.ativos[0].m < 90) return;
  if (rod.fase === "liga") { fecharLiga(st, rod); fecharRodada(st, rod); }
  else { fecharCopa(st, rod); st.copaPendente = false; fecharEtapaCopa(st, rod); }
}

function fecharLiga(st, rod) {
  const rodada = rod.rodada;
  for (let d = 0; d < st.nDiv; d++) rod.res.divisoes.push([]);
  for (const pm of rod.ativos) {
    const A = pm.A, B = pm.B, jogo = fecharPartida(pm);
    jogo.publico = pm.publico; jogo.renda = roundP(jogo.publico * pm.preco);
    anotarCal(A, rodada, B, true, jogo.gc, jogo.gf, jogo.publico, false); anotarCal(B, rodada, A, false, jogo.gf, jogo.gc, jogo.publico, false);
    A.ocup = 0.7 * (A.ocup || 0) + 0.3 * jogo.publico / (capacidade(A) + 1);        // 1010:c0c0
    lancar(A, jogo.renda, "bilheteira");
    registrar(A, jogo.gc, jogo.gf); registrar(B, jogo.gf, jogo.gc); anotarGoleada(st, A, B, jogo);
    aposJogo(st, A, jogo.gc, jogo.gf, true, rodada); aposJogo(st, B, jogo.gf, jogo.gc, false, rodada);
    rod.res.divisoes[pm.d].push(jogo);
  }
  rod.ativos = [];
}

function iniciarCopa(st, rod) {
  const rodada = rod.rodada, vivos = st.copa.vivos;
  rod.fase = "copa"; rod.ativos = [];
  if (!copaDevida(st, rodada)) return;
  if (!st.copa.sorteio) sortearCopa(st);
  const { fase, jogam, folga } = st.copa.sorteio; st.copa.sorteio = null;
  const tj = jogam.map(id => timePorId(st, id));
  const F = roundP(tj.reduce((a, t) => a + mediaForca(t), 0) / tj.length), X = tj.reduce((a, t) => a + t.X, 0) / tj.length;
  const preco = precoBilhete(F, X, st.m, true);
  rod.copaInfo = { fase, folga, preco };
  for (let k = 0; k < tj.length; k += 2) { const pm = iniciarPartida(st, tj[k], tj[k + 1], 1, proximoArbitro(st), fase === "Final"); pm.publico = publico(tj[k], tj[k + 1], true, pm.neutro); rod.ativos.push(pm); }
}

function sortearCopa(st) {          // o original mostra o adversario da Taca antes da rodada ("CASA TACA - 64 avos de final")
  const vivos = st.copa.vivos, n = vivos.length; let p = 1; while (p < n / 2) p *= 2;
  embaralhar(vivos);
  const fase = p === 1 ? "Final" : p <= 3 ? "Semifinais" : p <= 7 ? "Quartas de final" : p <= 15 ? "Oitavas de final" : `${p} avos de final`;
  st.copa.sorteio = { fase, jogam: vivos.slice(0, 2 * (n - p)), folga: vivos.slice(2 * (n - p)) };
}
function fecharCopa(st, rod) {
  const rodada = rod.rodada, { fase, folga, preco } = rod.copaInfo, seguem = [], jogos = [];
  for (const pm of rod.ativos) {
    const A = pm.A, B = pm.B, jogo = fecharPartida(pm);
    jogo.publico = pm.publico; jogo.renda = roundP(jogo.publico * preco / 2);
    anotarCal(A, rodada, B, true, jogo.gc, jogo.gf, jogo.publico, fase); anotarCal(B, rodada, A, false, jogo.gf, jogo.gc, jogo.publico, fase);
    if (pm.neutro) jogo.neutro = true; else A.ocup = 0.7 * (A.ocup || 0) + 0.3 * jogo.publico / (capacidade(A) + 1);
    lancar(A, jogo.renda, "bilheteira"); lancar(B, jogo.renda, "bilheteira");
    anotarGoleada(st, A, B, jogo);
    const venc = jogo.gc > jogo.gf ? A : jogo.gc < jogo.gf ? B : penaltisDesempate(st, A, B, jogo);
    seguem.push(venc.id); jogo.vencedor = venc.id;
    aposJogo(st, A, jogo.gc, jogo.gf, true, rodada); aposJogo(st, B, jogo.gf, jogo.gc, false, rodada);
    jogos.push(jogo);
  }
  st.copa.vivos = seguem.concat(folga); st.copa.fase = fase;
  st.copa.jogos.push({ rodada, fase, jogos: jogos.map(j => ({ casa: j.casa, fora: j.fora, gc: j.gc, gf: j.gf, pen: j.penTxt || "" })) });
  rod.res.copa = { fase, jogos };
  if (st.copa.vivos.length === 1) st.copa.campeao = st.copa.vivos[0];
  rod.ativos = [];
}

function fecharRodada(st, rod) {
  const res = rod.res;
  // classificacao, riqueza, evolucao (docs 11, 12, 13)
  for (let d = 0; d < st.divisoes.length; d++) {
    const div = st.divisoes[d].map(id => timePorId(st, id));
    let T = 1;
    if (d < st.nDiv) {
      div.sort((a, b) => b.pts - a.pts || (b.gp - b.gc) - (a.gp - a.gc) || b.gp - a.gp);
      st.divisoes[d] = div.map(t => t.id);
      T = Math.max(div.reduce((a, t) => a + t.caixa, 0) / st.refCaixa[d], 0.1);
    }
    div.forEach((t, i) => {
      if (d < st.nDiv) t.X = 0.9 * t.X + 0.1 * T;
      const ref = baseDivisao(d) - 2 * i;
      for (const j of t.jog) {
        if (j.c > 0 && (j.pos !== 0 || R.n(2) === 0)) { if (j.f < 50 && j.f + 1 <= Math.min(ref + 5, 50)) j.f++; }
        else if (j.c < 0 && R.n(2) === 0) { if (j.f > 1 && j.f - 1 >= Math.max(ref - 5, 1)) j.f--; }
      }
    });
  }
  st.m = atualizaIndice(st.m, (st.ano0 || 0) + st.temporada - 1);        // contador de temporadas = ano (DS:2b42)
  for (const t of st.times) gerirFinancas(st, t);
  st.ultimaRodada = resumo(st, res);
  st.copaPendente = copaDevida(st, rod.rodada);
  if (st.copaPendente) sortearCopa(st);
  if (rod.rodada === 14 && !st.copaPendente) fimTemporada(st);
  st.rng = R.estado();
  rod.fim = true; rod.ativos = [];
}

function jogarRodada(st) {          // uma jornada e, se houver, a rodada da Taca que vem depois
  let rod = iniciarRodada(st);
  while (!rod.fim) minutoRodada(st, rod);
  const res = rod.res;
  if (st.copaPendente) { rod = iniciarRodada(st); while (!rod.fim) minutoRodada(st, rod); res.copa = rod.res.copa; }
  return res;
}

let PRONTOS = new Set();

  if (ST.demitido) return pendencias();

  const falta = ST.humanos.findIndex((h, k) => !PRONTOS.has(k) && !h.demitido);
  if (falta >= 0) {                                         // passa a vez ao proximo treinador humano
    M.trocarVez(ST, falta); ABA = "jogo"; SEL = null; salvar();

    return;
  }

function correrEtapa() {
  ST.fimDeTemporada = null;
  for (const h of ST.humanos) { const t = T(h.id); if (t && t.formacao !== "auto" && t.formacao !== "melhores") t.manual = true; }

function telaJornada(rod) {

    const m = jogos.length ? jogos[0].m : 90;

    const arco = (frac, cor) => { if (frac <= 0) return ""; if (frac >= 1) return `<circle cx="17" cy="17" r="15" fill="${cor}"/>`; const a = frac * 2 * Math.PI, x = 17 + 15 * Math.sin(a), y = 17 - 15 * Math.cos(a); return `<path d="M17 17 L17 2 A15 15 0 ${frac > .5 ? 1 : 0} 1 ${x} ${y} Z" fill="${cor}"/>`; };

            <div><div style="font-size:11px">Em campo</div><div class="lista escolha">${tit.map(j => `<div class="ln ${sai === j.id ? "sel" : ""}" data-t="${j.id}">${POS1[j.pos]}<span>${esc(j.nome)}</span><span class="n">${j.f}</span></div>`).join("")}</div></div>
            <div><div style="font-size:11px">Reservas</div><div class="lista escolha">${sup.map(j => `<div class="ln ${entra === j.id ? "sel" : ""}" data-s="${j.id}">${POS1[j.pos]}<span>${esc(j.nome)}</span><span class="n">${j.f}</span></div>`).join("")}</div></div>
          </div></div>
        <div class="linhabt"><button class="bt grande" id="sub" ${sai && entra && t.trocas > 0 ? "" : "disabled"}><span class="ic">⇄</span>Substituir</button>${btOk("cont", "Continuar")}</div>`, { depois: (d) => {
          $$("[data-t]", d).forEach(x => x.onclick = () => { sai = +x.dataset.t; desenha(); });
          $$("[data-s]", d).forEach(x => x.onclick = () => { entra = +x.dataset.s; desenha(); });
          $("#sub", d).onclick = () => { const e = M.substituirNoJogo(pm, lado, sai, entra); if (e) toast(e); sai = entra = null; desenha(); };
          $("#pv", d).onchange = (e) => ST.opcoes.pararVermelho = e.target.checked;
          $("#pl", d).onchange = (e) => ST.opcoes.pararLesao = e.target.checked;
          $("#cont", d).onclick = () => { fechar(); res(); };
        } });
    };
    desenha();
  });
}
async function fimEtapa(rod, jogos) {
  // desempates por penaltis (cobranca a cobranca)
  if (rod.fase === "copa" && rod.res.copa) {
    for (const j of rod.res.copa.jogos) {
      if (!j.cobrancas) continue;
      const humano = [j.casa, j.fora].some(id => T(id).dono != null);
      if (!humano && !ST.opcoes.verDesempates) continue;
      await animDesempate(j);
    }
  }
  await esperar(500);
  salvar();
  if (rod.fase === "liga") dlgClassificacao(() => posEtapa(rod)); else posEtapa(rod);
}
function animDesempate(j) {
  return new Promise(async res => {
    const A = T(j.casa), B = T(j.fora); let pa = 0, pb = 0; const lin = [];
    const desenha = () => janela("Pênaltis", `<div class="desemp">Disputa de Pênaltis</div><div class="placarg">${pa}:${pb}</div>
      <div style="display:flex;justify-content:space-between;margin:4px 0"><span style="${cores(A)};padding:0 3px">${esc(A.curto)}</span><span style="${cores(B)};padding:0 3px">${esc(B.curto)}</span></div>
      <div class="lista" style="max-height:150px">${lin.join("")}</div>`, { classe: "verdec" });
    const rot = (r) => r === "gol" ? "GOL" : r === "defesa" ? "Defendeu" : r === "para fora" ? "Para fora" : r === "por cima" ? "Por cima" : r === "no travessão" ? "No travessão" : "Na trave";
    desenha();
    for (let i = 0; i < j.cobrancas.length; i++) {
      const [l, n, r] = j.cobrancas[i]; if (r === "gol") l ? pb++ : pa++;
      if (!l) lin.push(`<div class="ln" style="grid-template-columns:1fr 60px 1fr 60px;gap:2px"><span>${esc(n)}</span><b>${rot(r)}</b><span></span><b></b></div>`);
      else { const u = lin.length - 1; if (u >= 0 && lin[u].includes("<span></span><b></b>")) lin[u] = lin[u].replace("<span></span><b></b>", `<span>${esc(n)}</span><b>${rot(r)}</b>`); else lin.push(`<div class="ln" style="grid-template-columns:1fr 60px 1fr 60px;gap:2px"><span></span><b></b><span>${esc(n)}</span><b>${rot(r)}</b></div>`); }
      desenha(); await esperar(ST.opcoes.tempo === "rapido" ? 250 : 650);
    }
    await esperar(900); fechar(); res();
  });
}
// depois de cada jornada: leiloes do computador, pedidos de aumento, despedimentos, fim de epoca
async function posEtapa(rod) {
  for (const L of M.leiloesPendentes(ST).slice()) await dlgLeilao(L);
  for (let k = 0; k < ST.humanos.length; k++) {
    M.trocarVez(ST, k);
    await pedidosAumento();
  }
  M.trocarVez(ST, 0);
  if (ST.fimDeTemporada) await new Promise(r => { const f = ST.fimDeTemporada;
    aviso(`Fim da temporada ${f.ano || ""}`, `Campeão: <b>${esc(f.campeao)}</b><br>Copa: <b>${esc(f.taca)}</b><br><br>${esc(ST.treinador)}: ${esc(f.meu)}${f.mov ? " — " + esc(f.mov) : ""}`, r); });
  salvar();
  // rodada da Taca sem humanos: o original joga-a logo a seguir
  if (M.proximaEtapa(ST) === "copa" && ST.copa.sorteio && !ST.copa.sorteio.jogam.some(id => T(id).dono != null)) {
    if (ST.opcoes.sorteio === "sempre") await verSorteio();
    return correrEtapa();
  }
  if (M.proximaEtapa(ST) === "copa" && ST.opcoes.sorteio !== "nunca") await verSorteio();
  ABA = "jogo"; SEL = null; principal();
}
function verSorteio() {
  return new Promise(r => { const s = ST.copa.sorteio; if (!s) return r();
    const pares = []; for (let k = 0; k < s.jogam.length; k += 2) pares.push([T(s.jogam[k]), T(s.jogam[k + 1])]);
    janela(`Sorteio da Copa - ${s.fase}`, `<div class="lista" style="max-height:60vh">${pares.map(([a, b]) => `<div class="ln" style="grid-template-columns:1fr 1fr;gap:4px"><span style="${cores(a)};padding:0 3px">${esc(a.curto)}</span><span style="${cores(b)};padding:0 3px">${esc(b.curto)}</span></div>`).join("")}</div>
      ${s.folga.length ? `<div style="font-weight:normal;margin-top:4px">${s.folga.length} times passam direto.</div>` : ""}<div class="linhabt">${btOk()}</div>`, { depois: (d) => $("#ok", d).onclick = () => { fechar(); r(); } }); });
}
function dlgLeilao({ a, t, j }) {
  return new Promise(res => {
    // cada treinador humano pode licitar, conforme o seu perfil (Treinador > Perfil > Compra em leilao)
    const lances = {};
    const humanos = ST.humanos.map((h, k) => k).filter(k => {
      const h = ST.humanos[k]; if (h.demitido || h.id === t.id) return false;
      const o = ST.opcoes; if (o.compra === "nao") return false;
      if (o.compra === "fracos") { const v = ST.vez; M.trocarVez(ST, k); const i = M.interesseHumano(ST, j); M.trocarVez(ST, v); return i > 1; }
      return true;
    });
    const fim = () => {
      let melhor = 0, quem = null; for (const [k, v] of Object.entries(lances)) if (v > melhor) { melhor = v; quem = +k; }
      if (quem != null) M.trocarVez(ST, quem);
      const r = M.resolverLeilao(ST, j.id, melhor);
      M.trocarVez(ST, 0);
      if (melhor && r) toast(r.comprador ? `${j.nome} vendido ao ${r.comprador.curto} por ${milhar(r.valor)} ${suf()}.` : `${j.nome} não foi vendido.`);
      res();
    };
    if (!humanos.length) return fim();
    let idx = 0;
    const proximo = () => {
      if (idx >= humanos.length) return fim();
      const k = humanos[idx++]; M.trocarVez(ST, k); const Hm = H();
      const sal = M.salario(j.f, 1, ST.m);
      janela("Venda de jogador por leilão", `<div style="display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-weight:normal">
          <span>Time</span><b style="${cores(t)};padding:0 3px;justify-self:start">${esc(t.curto)}</b>
          <span>Jogador</span><b>${esc(j.nome)}${j.estrela ? "*" : ""}</b><span>Posição</span><b>${POSN[j.pos]}</b><span>Força</span><b style="font-size:15px">${j.f}</b>
          <span>Salário pretendido</span><b>${milhar(sal)} ${suf()}</b><span>Preço base</span><b>${esc(extenso(a.minimo))}</b>
          <span>Nacionalidade</span><span class="band">${bandeira(j.nac)}<b>${esc(nomePais(j.nac))}</b></span>
          <span>Comportamento</span><span>${M.TEMPERAMENTO[j.t]}</span><span>Gols na temporada</span><span>${j.golsTemp}</span></div>
        <div class="grupo" style="background:var(--amarelo);display:grid;grid-template-columns:1fr auto;font-weight:normal"><span class="leg">Histórico</span><span>Jogos</span><span>${j.jogos}</span><span>Gols</span><span>${j.gols}</span><span>Cartões vermelhos</span><span>${j.verm || 0}</span><span>Lesões</span><span>${j.nles || 0}</span></div>
        <div class="baixo" style="--c1:${rgb(Hm.cor, 0)};--c2:${contra(Hm.cor, 0, 3)}"><div><div style="font:bold 14px 'Times New Roman',serif">${esc(ST.treinador)}</div>
          Oferta (${suf()}):<br>${campoDinheiro("lance", 0)}Dinheiro em caixa: ${esc(extenso(Hm.caixa))}</div>${btOk()}</div>`,
        { classe: "leilao", depois: (d) => { ligarDinheiro(d); $("#ok", d).onclick = () => { const v = lerDinheiro("lance"); if (v > 0) lances[k] = Math.min(v, Hm.caixa); fechar(); M.trocarVez(ST, 0); proximo(); }; } });
    };
    proximo();
  });
}
async function pedidosAumento() {
  const t = H();
  while (ST.pedidos.length) {
    const p = ST.pedidos[0], j = t.jog.find(q => q.id === p.id);
    if (!j) { ST.pedidos.shift(); continue; }
    const cat = M.categoria(j.nac, t.pais), auto = ST.opcoes.salAuto[cat];
    if (auto) { M.responderPedido(ST, p.id, true); continue; }
    await new Promise(r => perguntaCores(t, "Atualização de Salário",
      `${esc(j.nome)} pede que lhe seja aumentado o salário para ${milhar(p.pedido)} ${suf()}.<br>Se não aceitar o aumento, o jogador será posto à venda em leilão.<br><br>Aceita o aumento?`,
      () => { M.responderPedido(ST, p.id, true); r(); }, () => { M.responderPedido(ST, p.id, false); r(); }));
  }
}
function pendencias() {
  if (!ST.demitido) return;
  const dm = ST.demitido;
  janela("Demitido", `<div>A diretoria do ${esc(T(dm.de).nome)} demitiu ${esc(ST.treinador)}. ${esc(dm.motivo)}</div>
    <div style="font-weight:normal;margin:6px 0">${dm.ofertas.length ? "Estes clubes querem contratá-lo:" : "Nenhum clube fez proposta."}</div>
    <div class="lista">${dm.ofertas.map((id, i) => { const x = T(id); return `<label class="ln" style="grid-template-columns:auto 1fr auto;align-items:center;padding:3px"><input type="radio" name="of" value="${id}" ${i ? "" : "checked"}><span style="${cores(x)};padding:0 3px">${esc(x.curto)}</span><span>${nomeDiv(M.divisaoDe(ST, id))}</span></label>`; }).join("")}</div>
    <div class="linhabt">${btOk()}</div>`, { depois: (d) => $("#ok", d).onclick = () => { const s = $("input[name=of]:checked", d); if (!s) return; M.aceitarEmprego(ST, +s.value); salvar(); fechar(); ABA = "jogo"; principal(); } });
}

window.claude?.hot?.snapshot?.(() => ({ aba: ABA }));
inicio();
</script>
